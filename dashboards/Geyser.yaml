  - title: GSS WDM
    path: gss-wdm
    subview: true
    type: custom:vertical-layout
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:slider-button-card
            entity: input_number.gss_wdm_runtime_in
            icon:
              icon: ''
              use_state_color: false
              show: false
            slider:
              direction: left-right
              background: gradient
              use_state_color: false
              use_percentage_bg_opacity: true
              show_track: true
              toggle_on_click: false
              force_square: false
            action_button:
              show: true
              mode: custom
              tap_action:
                action: call-service
                service: script.write_gss_wdm_runtime
                target: {}
              show_spinner: true
            show_state: true
            show_attribute: false
            show_name: true
            compact: true
