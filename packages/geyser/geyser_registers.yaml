script:
  write_gss_runtime_sp:
    alias: "Write Geyser Runtime SP"
    sequence:
      - action: modbus.write_register
        data:
          hub: BC9000
          address: 16386
          value: "{{ states('input_number.gss_runtime_sp') |int }}"

  write_gss_wdm_runtime:
    alias: "Write Geyser SP WDM Runtime"
    sequence:
      - action: modbus.write_register
        data:
          hub: BC9000
          address: 16394
          value: "{{ states('input_number.gss_wdm_runtime_in') |int }}"

  write_gss_wdm_hour:
