views:
  - title: GSP BUTTONS
    path: gsp-buttons
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.gss_wdm_runtime
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-geyser/gss-wdm
