## Zone01 - Automatic and Manual mode
write_irrigation_zone01_auto_on:
  alias: "Write Zone01 Auto On"
  sequence:
    action: ads.write_data_by_name
    target: {}
    data:
      adsvar: .stZone01Ctrl.bAutoMan
      adstype: bool
      value: 1

write_irrigation_zone01_auto_off:
  alias: "Write Zone01 Auto Off"
  sequence:
    action: ads.write_data_by_name
    target: {}
    data:
      adsvar: .stZone01Ctrl.bAutoMan
      adstype: bool
      value: 0

