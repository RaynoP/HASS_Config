  - title: MODBUS
    path: modbus
    badges: []
    cards:
      - type: button
        name: Geyser On/Off
        show_name: true
        show_icon: true
        icon: mdi:heating-coil
        tap_action:
          action: call-service
          service: switch.toggle
          target:
            entity_id: switch.geyser_on_req
        hold_action:
          action: call-service
          service: switch.toggle
          target:
            entity_id: switch.geyser_off_req
        entity: sensor.geyser_icon_color
        style: |
          ha-icon {
            color: var(--geyser-icon-color);
          }
        template:
          icon_color: |
            {% if is_state('sensor.geyser_icon_color', 'yellow') %}
              yellow
            {% else %}
              blue
            {% endif %}
      - type: entities
        entities:
          - entity: switch.geyser_on_req
          - entity: switch.geyser_off_req
          - entity: binary_sensor.geyser_coil
          - entity: sensor.geyser_remaintime
        title: Geyser Discrete Statusses
        show_header_toggle: false
        state_color: true
        card_mod:
          style: |
            ha-card {
              color: red;
            }
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: toggle
        entity: sensor.geyser_icon_color
        show_state: true
  - type: sections
    max_columns: 4
    title: Weekly Planner
    path: weekly-planner
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: custom:week-planner-card
            calendars:
              - entity: calendar.rayno_powell_gmail_com
                name: RaynoP
            days: 7
            startingDay: today
            startingDayOffset: 0
            hideWeekend: false
            noCardBackground: false
            compact: false
            weather:
              showCondition: true
              showTemperature: true
              showLowTemperature: true
              useTwiceDaily: false
              entity: weather.wierdapark
            locale: en
            showLocation: true
            hidePastEvents: false
            hideDaysWithoutEvents: false
            hideTodayWithoutEvents: false
            combineSimilarEvents: false
            showLegend: false
            showNavigation: true
            showDescription: true
  - type: sections
    max_columns: 4
    title: Geyser Test
    path: geyser-test
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New section
          - square: true
            type: grid
            cards:
              - show_name: true
                show_icon: true
                type: button
                entity: switch.geyser_on_req
              - show_name: true
                show_icon: true
                type: button
                entity: switch.geyser_off_req
            columns: 2
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: none
            entity: binary_sensor.geyser_coil
            icon: mdi:alarm-light
            show_state: true
            hold_action:
              action: none
            grid_options:
              columns: full
              rows: 3
          - type: entities
            entities:
              - entity: sensor.geyser_runtime
              - entity: sensor.geyser_remaintime
      - type: grid
        cards:
          - type: heading
            heading: New section
          - square: false
            type: grid
            cards:
              - type: entities
                entities:
                  - entity: sensor.energy_price
                    secondary_info: last-changed
                  - entity: sensor.geyser_current_power
                    secondary_info: last-changed
                  - entity: sensor.geyser_heating_active_last_minute
                    secondary_info: last-changed
                  - entity: sensor.geyser_energy_last_minute
                    secondary_info: last-changed
                  - entity: sensor.geyser_cost_last_minute
                    secondary_info: last-changed
                  - entity: sensor.current_energy_costing
                    secondary_info: last-changed
            columns: 1
          - type: entities
            entities:
              - entity: sensor.geyser_used_today
                secondary_info: last-changed
              - entity: sensor.geyser_daily_cost
                secondary_info: last-changed
              - entity: sensor.geyser_used_this_month
                secondary_info: last-changed
              - entity: sensor.geyser_monthly_cost
                secondary_info: last-changed
            state_color: false
    header:
      card:
        type: markdown
        text_only: true
        content: |
          # Geyser Costing Test
