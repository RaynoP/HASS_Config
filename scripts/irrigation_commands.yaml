flip_hose_or_zone:
  alias: "Hose or Zone"
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.irrigation_control_value_hose_or_zone
          state: "off"
      then:
        - action: script.set_irrigation_hose_or_zone
      else:
        - action: script.reset_irrigation_hose_or_zone

## Set the HoseOrZoneVal to TRUE
set_irrigation_hose_or_zone:
  alias: "Set Hose or Zone"
  sequence:
    action: ads.write_data_by_name
    target: {}
    data:
      adsvar: SprinklerControl.bHoseOrZoneVal
      adstype: bool
      value: 1

## Set the HoseOrZoneVal to FALSE
reset_irrigation_hose_or_zone:
  alias: "Reset Hose or Zone"
  sequence:
    action: ads.write_data_by_name
    target: {}
    data:
      adsvar: SprinklerControl.bHoseOrZoneVal
      adstype: bool
      value: 0

## Write HoseOrZoneVal response
write_irrigation_hose_or_zone_response:
  alias: "Write Hose or Zone response"
  sequence:
    action: ads.write_data_by_name
    target: {}
    data:
      adsvar: SprinklerControl.bHoseOrZoneRes
      adstype: bool
      value: 1
###########################################################

