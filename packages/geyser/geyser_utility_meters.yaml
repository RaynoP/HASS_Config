  geyser_daily_cost:
    name: "Geyser Daily Cost"
    unique_id: "geyser_daily_cost"
    source: sensor.geyser_cost_last_minute
    cycle: daily
  geyser_monthly_cost:
    name: "Geyser Monthly Cost"
    unique_id: "geyser_monthly_cost"
    source: sensor.geyser_cost_last_minute
    cycle: monthly
