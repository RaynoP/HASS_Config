        entities:
          - entity: sensor.external_ip
          - entity: sensor.speedtest_download
          - entity: sensor.speedtest_upload
          - entity: sensor.speedtest_ping
      - type: grid
        square: false
        columns: 1
        cards:
          - show_state: true
            show_name: true
            camera_view: auto
            type: picture-entity
            entity: camera.embedded_net_dvr_profilename001
            name: Gate
          - show_state: true
            show_name: true
            camera_view: auto
            type: picture-entity
            entity: camera.embedded_net_dvr_profilename002
            name: Gerage
          - show_state: true
            show_name: true
            camera_view: auto
            type: picture-entity
            entity: camera.embedded_net_dvr_profilename003
            name: Side Wall
          - show_state: true
            show_name: true
            camera_view: auto
            type: picture-entity
            entity: camera.embedded_net_dvr_profilename004
            name: Entertainment Area
      - type: entities
        entities:
          - entity: light.wled_dollhouse1_main
            name: Main
          - entity: select.wled_dollhouse1_playlist
            name: Playlist
          - entity: select.wled_dollhouse1_preset
            name: Preset
          - entity: light.wled_dollhouse1_segment_1
            name: Segment 1
          - entity: light.wled_dollhouse1_segment_2
            name: Segment 2
          - entity: light.wled_dollhouse1_segment_3
            name: Segment 3
          - entity: light.wled_dollhouse1_segment_4
            name: Segment 4
          - entity: light.wled_dollhouse1_segment_5
            name: Segment 5
          - entity: light.wled_dollhouse1_segment_6
            name: Segment 6
          - entity: light.wled_dollhouse1_segment_7
            name: Segment 7
          - light.wled_dollhouse1
        title: WLED-DollHouse1
