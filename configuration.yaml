# Core Configuration
# https://www.home-assistant.io/docs/configuration/basic/
homeassistant:
  name: Home
  latitude: !secret latitude_home
  longitude: !secret longitude_home
  elevation: 1462
  unit_system: metric
  currency: ZAR
  country: ZA
  time_zone: "Africa/Johannesburg"
  #external_url: "https://www.example.com"
  #internal_url: "http://homeassistant.local:8123"
  packages: !include_dir_named packages
  allowlist_external_dirs: # changed from whitelist_external_dirs to allowlist_external_dirs in 0.113.0
    - /config/
#http: !include includes/http.yaml

# I basically make a package for home automation project and group everything about it 
# in a folder then use !include_dir_named
# Make files smaller by putting each automation, script and sensor in its own file and 
# using !include_dir_merge_list


# Loads default set of integrations. Do not remove.
default_config:
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /www/community/lovelace-card-mod/card-mod.js

# ########################################
# ###              LOGGING             ###
# ########################################
logbook: !include logging/logbook.yaml
logger: !include logging/logger.yaml

# Main recorder for historical data & InfluxDB
recorder: !include includes/recorder.yaml
influxdb: !include includes/influxdb.yaml


# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml

# Does not work to split scripts
#script split: !include_dir_merge_list scripts
#script: !include scripts.yaml
script: !include_dir_merge_named scripts/.

#scene: !include scenes.yaml

#input_number: !include input-number.yaml


