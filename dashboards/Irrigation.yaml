title: Irrigation
views:
  - path: default_view
    title: GARDEN GLANCE
    icon: mdi:water
    type: custom:grid-layout
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: binary_sensor.irrigation_main_sequence_run
                color: auto
                color_type: card
                label: |
                  [[[
                    return 'Seq: ' + states['sensor.cx9020_mbunitid_2'].state;
                  ]]]
                show_label: true
                tap_action:
                  action: call-service
                  service: script.write_irrigation_run_main_seq_on
                hold_action:
                  action: call-service
                  service: script.write_irrigation_run_main_seq_off
                name: Main Sequence
                styles:
                  card:
                    - font-size: 12px
                    - font-weight: bold
                    - height: 120px
                state:
                  - value: 'off'
                    color: rgb(255, 0, 0)
                    icon: mdi:run
                  - value: 'on'
                    color: rgb(0, 255, 0)
                    icon: mdi:run-fast
              - type: tile
                entity: sensor.irrigation_control_modbus_sequence_run
                icon: mdi:stop
                name: MB Seq Value
                color: accent
                show_entity_picture: false
                vertical: true
                features_position: bottom
              - type: tile
                entity: binary_sensor.irrigation_control_valve_auto_automatic_enabled
                icon: mdi:all-inclusive-box
                name: Auto Enabled
                color: accent
                show_entity_picture: false
                tap_action:
                  action: call-service
                  service: script.flip_auto_enabled
                  target: {}
                vertical: true
                hide_state: true
                features_position: bottom
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: binary_sensor.irrigation_control_pump_running_feedback
                        state: 'on'
                    card:
                      type: tile
                      entity: binary_sensor.irrigation_main_sequence_run
                      icon: mdi:pump
                      name: Pump Running
                      hide_state: true
                      tap_action:
                        action: call-service
                        service: script.write_sprinkler_control_manual_stop_request
                        target: {}
                      vertical: true
                      features_position: bottom
                  - type: tile
                    tap_action:
                      action: navigate
                      navigation_path: /dashboard-dashboard/timers
                    show_entity_picture: false
                    icon: mdi:clock
                    color: purple
                    name: Timers
                    entity: binary_sensor.irrigation_control_pump_running_feedback
                    hide_state: true
                    vertical: true
                    features_position: bottom
                  - type: entity
                    entity: input_boolean.expand_card
                    tap_action:
                      action: toggle
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.irrigation_control_pump_running_feedback
                    state: 'on'
                  - condition: numeric_state
                    entity: sensor.irrigation_control_runtimer_elapsed_time
                    above: 1
                card:
                  type: custom:gauge-card
                  entity: sensor.irrigation_control_runtimer_elapsed_time
                  title: Remain Mins.
                  unit_of_measure: Min
                  min: 0
                  max: 120
                  severity:
                    red: 0
                    amber: 5
                    green: 10
                  size: 150
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.irrigation_control_pump_running_feedback
                    state: 'on'
                  - condition: numeric_state
                    entity: sensor.irrigation_control_runtimer_elapsed_secondstime
                    above: 1
                card:
                  type: custom:gauge-card
                  entity: sensor.irrigation_control_runtimer_elapsed_secondstime
                  title: Remain Sec.
                  unit_of_measure: Sec
                  min: 0
                  max: 60
                  severity:
                    red: 0
                    amber: 10
                    green: 20
                  size: 60
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.expand_card
                    state: 'on'
                card:
                  type: entities
                  entities:
                    - entity: sensor.irrigation_pump_runtime_totaliser_today
                    - entity: sensor.irrigation_pump_runtime_totaliser_weekly
                    - entity: sensor.irrigation_pump_runtime_totaliser_monthly
                    - entity: sensor.irrigation_pump_runtime_totaliser_all
                  title: Pump Runtime
                  show_header_toggle: false
                  state_color: true
      - type: vertical-stack
        cards:
