  - type: custom:grid-layout
    title: GSP GLANCE
    subview: false
    badges: []
    cards:
      - show_name: true
        show_icon: true
        show_state: true
        title: Week Day - Morning SPs
        type: glance
        entities:
          - entity: sensor.gss_wdm_runtime
          - entity: sensor.gss_wdm_hour_2
          - entity: sensor.gss_wdm_minute_2
        state_color: true
        card_mod:
          style: |
            ha-card {
              color: teal;
            }
      - show_name: true
        show_icon: true
        show_state: true
        title: Week Day - Evening SPs
        type: glance
        entities:
          - sensor.gss_wde_runtime
          - sensor.gss_wde_hour
          - sensor.gss_wde_minute
        state_color: true
        card_mod:
          style: |
            ha-card {
              color: teal;
            }
      - title: Week End - Morning SPs
        show_name: true
        show_icon: true
        show_state: true
        type: glance
        entities:
          - sensor.gss_wem_runtime
          - sensor.gss_wem_hour
          - sensor.gss_wem_minute
        state_color: true
        card_mod:
          style: |
            ha-card {
              color: teal;
