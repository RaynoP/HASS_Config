title: Home
views:
  - path: default_view
    title: Home
    cards:
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.minutes_to_next_loadshedding
            below: 7777
        card:
          type: gauge
          entity: sensor.minutes_to_next_loadshedding
          needle: true
          severity:
            green: 120
            yellow: 60
            red: 10
          max: 1440
          unit: Min
      - type: custom:sunsynk-power-flow-card
        cardstyle: full
        show_solar: false
        inverter:
          modern: false
          model: lux
          autarky: 'no'
        battery:
          show: true
          energy: 4500
          shutdown_soc: 1
          show_daily: true
          invert_power: true
        solar:
          show_daily: false
          mppts: 1
          pv1_name: none
          pv2_name: none
        load:
          show_daily: true
          dynamic_colour: true
          dynamic_icon: true
          max_power: 4000
          essential_name: Essential
        grid:
          show_daily_buy: true
          show_nonessential: false
          invert_grid: true
          no_grid_colour: red
          grid_off_colour: red
          max_power: 4000
          label_daily_grid_buy: Kak en betaal
        entities:
          inverter_voltage_154: sensor.lux_3113630025_grid_voltage_live
          load_frequency_192: sensor.lux_3113630025_grid_frequency_live
          inverter_current_164: sensor.inverter_output_current
          inverter_status_59: sensor.lux_3113630025_status
          inverter_power_175: sensor.lux_3113630025_battery_flow_live
          day_battery_charge_70: sensor.lux_3113630025_battery_charge_daily
          day_battery_discharge_71: sensor.lux_3113630025_battery_discharge_daily
          battery_voltage_183: sensor.lux_3113630025_battery_voltage_live
          battery_soc_184: sensor.lux_3113630025_battery
          battery_power_190: sensor.lux_3113630025_battery_flow_live
          battery_current_191: sensor.lux_3113630025_battery_capacity_ah
          grid_power_169: sensor.lux_3113630025_grid_flow_live
          day_grid_import_76: sensor.lux_3113630025_power_from_grid_daily
          grid_ct_power_172: sensor.lux_3113630025_grid_flow_live
          day_load_energy_84: sensor.lux_3113630025_home_consumption_daily
          essential_power: sensor.lux_3113630025_home_consumption_live
          radiator_temp_91: sensor.lux_3113630025_radiator_1_temperature_live
          dc_transformer_temp_90: sensor.lux_3113630025_radiator_2_temperature_live
          remaining_solar: sensor.forecast_remaining_today
          energy_cost: sensor.energy_price
          prepaid_units: sensor.current_utility_prepaid_reading
          day_pv_energy_108: none
          pv_total: none
          pv1_power_186: none
          pv2_power_187: none
      - type: custom:lux-power-distribution-card
        inverter_count: 1
        battery_soc:
          entities:
            - sensor.lux_3113630025_battery
        battery_flow:
          entities:
            - sensor.lux_3113630025_battery_flow_live
        home_consumption:
          entities:
            - sensor.lux_3113630025_home_consumption_live
        grid_flow:
          entities:
            - sensor.lux_3113630025_grid_flow_live
        lux_dongle:
          - BA31600006
        inverter_alias:
          - Inverter 1
        battery_voltage:
          entities:
            - sensor.lux_3113630025_battery_voltage_live
        backup_power:
          entities:
            - sensor.lux_3113630025_power_to_eps_live
        grid_voltage:
          entities:
            - sensor.lux_3113630025_grid_voltage_live
        update_time:
          entities:
            - sensor.lux_3113630025_data_received_time
          show_last_update: true
        grid_indicator:
          hue: true
        status_codes:
          entities:
            - sensor.lux_3113630025_status
          no_grid_is_warning: true
        refresh_button: right
      - type: entities
        entities:
          - entity: sensor.energy_price
          - entity: sensor.energy_used_this_month
          - entity: sensor.current_energy_cost
          - entity: sensor.current_utility_prepaid_reading
            secondary_info: last-updated
          - entity: sensor.geyser_used_today
          - entity: sensor.geyser_used_this_month
          - entity: sensor.geyser_current_power
          - entity: sensor.geyser_energy_last_minute
          - entity: sensor.current_energy_costing
          - entity: sensor.geyser_cost_last_minute
          - entity: sensor.lux_3113630025_battery_charge_daily
        title: Costing
      - type: logbook
        target:
          entity_id:
            - weather.wierdapark
      - type: markdown
        content: >+
          {% set ns = namespace(schedule_date='') %}

          ### {{ states('sensor.esp_loadshedding_events') }} 

          {% set events =
          states.sensor.esp_loadshedding_events.attributes.events %}

          {% if events is defined and events %}

          {% for stage in
          states.sensor.esp_loadshedding_events.attributes.events %}

          {%- set dt = strptime(stage.start, '%Y-%m-%dT%H:%M:%S%z') %}
              {% if (ns.schedule_date != dt.date() ) -%}
              {{ dt.date().strftime('%Y/%m/%d -- %A') }}
              
              {% set ns.schedule_date = dt.date() %}
            {%- endif %}
              {%- if (stage.note == "Stage 0") -%}🟢
              {%- elif (stage.note == "Stage 1") -%}🟡
              {%- elif (stage.note == "Stage 2") -%}🟠
              {%- elif (stage.note == "Stage 3") -%}🔴
              {%- elif (stage.note == "Stage 4") -%}🔵
              {%- elif (stage.note == "Stage 5") -%}🟣
              {%- elif (stage.note == "Stage 6") -%}🟤
              {%- elif (stage.note == "Stage 7") -%}⚫
              {%- elif (stage.note == "Stage 8") -%}⚪
              {%- else %}💀
              {%- endif %} {{ dt.time().strftime('%H:%M') }} - {{strptime(stage.end, '%Y-%m-%dT%H:%M:%S%z').time().strftime('%H:%M')}} : {{ stage.note }}
            {%- endfor %}
          {% else %}
            # Current Stage: Fokkol!! ⚡
          {% endif %}


          {% set EskomShed = states('sensor.eskom') | int - 1 %}


          Rest call counter: {{ states('sensor.esp_loadshedding_callcount') }} 

          ### Eskom Level: {{ EskomShed }}

          {% if EskomShed > 0 %}
            Next LoadShedding: {{ states('sensor.next_loadshedding') }}
          {% endif %}

        title: Load Shedding
      - show_current: true
        show_forecast: true
        type: weather-forecast
        entity: weather.wierdapark
        forecast_type: hourly
        secondary_info_attribute: humidity
        name: Today
      - show_current: true
        show_forecast: true
        type: weather-forecast
        entity: weather.wierdapark
        forecast_type: daily
        secondary_info_attribute: pressure
        name: Forecast
