      - type: vertical-stack
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.viera_dt60_series
            fill_container: true
            icon: mdi:remote
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: call-service
