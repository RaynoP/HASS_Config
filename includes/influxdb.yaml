### Connection Setting ###
host: !secret influx_db_hostname
port: 8086
database: homeassistant
username: homeassistant
password: !secret influx_db_user_pw
max_retries: 3
default_measurement: state
ssl: false

### measurements setup ###
tags:
  source: ha
tags_attributes:
  - friendly_name
